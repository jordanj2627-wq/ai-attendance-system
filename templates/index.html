<!DOCTYPE html>
<html>
<head>
    <title>AI Attendance System</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f9;
        }

        .container{
            width:500px;
            max-width:95%;
            margin:30px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px lightgray;
        }

        h1{
            text-align:center;
            color:#0b5394;
        }

        input,
        select{
            width:100%;
            padding:10px;
            margin-top:10px;
            box-sizing:border-box;
        }

        button{
            background:#0b5394;
            color:white;
            border:none;
            padding:12px;
            width:100%;
            margin-top:15px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#083763;
        }

        .checkout-btn{
            background:#2e7d32;
        }

        .checkout-btn:hover{
            background:#1b5e20;
        }
    </style>
</head>

<body>

<div class="container">

    <div style="text-align:center;margin-bottom:20px;">

        <img
            src="{{ url_for('static', filename='company_banner.jpg') }}"
            style="
                width:100%;
                max-height:300px;
                object-fit:cover;
                border-radius:10px;
                margin-bottom:20px;
            "
        >

        <h1 style="
            color:#0b5394;
            font-size:42px;
            margin-bottom:10px;
        ">
            BRIGHT TRADING INDIA LLP
        </h1>

        <h3 style="
            color:#666;
            font-weight:normal;
        ">
            Attendance Management System
        </h3>

    </div>

    <h1>AI Training Attendance System</h1>

    <form action="/save" method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            id="name"
            placeholder="Enter Your Name"
            required
        >

        <br><br>

        <label>Department</label>

        <select name="department" required>

            <option value="">Select Department</option>

            <option value="Accounts">Accounts</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="IT">IT</option>
            <option value="Production">Production</option>
            <option value="Buying">Buying</option>
            <option value="Export">Export</option>

        </select>

        <br><br>

        <label>Take Selfie</label>

        <video
            id="camera"
            width="100%"
            autoplay
            playsinline
            muted
            style="
                border:2px solid #ccc;
                border-radius:10px;
                background:black;
            ">
        </video>

        <br><br>

        <button
            type="button"
            onclick="capturePhoto()">
            Capture Selfie
        </button>

        <canvas
            id="photoCanvas"
            style="display:none;">
        </canvas>

        <img
            id="preview"
            style="
                width:100%;
                display:none;
                margin-top:10px;
                border-radius:10px;
            ">

        <input
            type="hidden"
            name="photo_data"
            id="photo_data">

        <button type="submit">
            Check In
        </button>

    </form>

    <br>

    <form action="/checkout" method="POST">

        <label>Employee Name For Check Out</label>

        <input
            type="text"
            name="name"
            placeholder="Enter Your Name"
            required>

        <button
            type="submit"
            class="checkout-btn">
            Check Out
        </button>

    </form>

</div>

<script>

const video = document.getElementById("camera");

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user"
                }
            });

        video.srcObject = stream;

    } catch (error) {

        console.error(error);

        alert(
            "Camera access failed.\n\n" +
            "Please allow camera permission and refresh the page.\n\n" +
            error.message
        );
    }
}

startCamera();

function capturePhoto() {

    if (!video.srcObject) {

        alert("Camera is not running.");
        return;
    }

    const canvas =
        document.getElementById("photoCanvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData =
        canvas.toDataURL("image/png");

    document.getElementById(
        "photo_data"
    ).value = imageData;

    const preview =
        document.getElementById(
            "preview"
        );

    preview.src = imageData;
    preview.style.display = "block";

    alert("Selfie Captured Successfully");
}

</script>

</body>
</html>
